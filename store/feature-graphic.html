<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1024px; height:500px; overflow:hidden; }
  body {
    background:#0A0A0C;
    font-family: "Segoe UI", system-ui, sans-serif;
    display:flex; align-items:center;
    position:relative;
  }
  .glow {
    position:absolute; left:40px; top:50%; transform:translateY(-50%);
    width:460px; height:460px; border-radius:50%;
    background: radial-gradient(circle, rgba(243,241,234,0.13) 0%, rgba(243,241,234,0.04) 42%, transparent 68%);
  }
  .stage { position:relative; display:flex; align-items:center; width:100%; padding:0 52px 0 44px; gap:36px; }
  canvas { display:block; }
  .copy { flex:1; }
  .word { font-size:140px; font-weight:300; letter-spacing:-4px; color:#F3F1EA; line-height:1; }
  .tag  { margin-top:24px; font-size:34px; font-weight:400; color:#CFCABE; line-height:1.34; }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="stage">
    <canvas id="c" width="404" height="470"></canvas>
    <div class="copy">
      <div class="word">Tama</div>
      <div class="tag">Erinnerungen, die nicht nerven.<br>Und ein Wesen, das davon lebt.</div>
    </div>
  </div>

<script>
// Echte Koordinaten aus AvatarBody.kt (PUFFLING), 16x16-Raster.
const silhouette = [
  [7,6],[8,6],
  [6,7],[7,7],[8,7],[9,7],
  [5,8],[6,8],[7,8],[8,8],[9,8],[10,8],
  [4,9],[5,9],[6,9],[7,9],[8,9],[9,9],[10,9],[11,9],
  [4,10],[5,10],[6,10],[7,10],[8,10],[9,10],[10,10],[11,10],
  [5,11],[6,11],[7,11],[8,11],[9,11],[10,11],
  [6,12],[7,12],[8,12],[9,12],
  [7,13],[8,13]
];
const accessory = [[6,4],[5,5],[9,4],[10,5]];
const eyes  = [[6,9],[6,10],[9,9],[9,10]];
const mouth = [[6,11],[7,11],[8,11],[9,11]];   // mouthOpen - freundlicher
const feet  = [[6,14],[9,14]];
const tail  = [[11,10],[12,9]];

const key = p => p[0] + ',' + p[1];
const holes = new Set([...eyes, ...mouth].map(key));
const lit = new Set();
silhouette.forEach(p => { if (!holes.has(key(p))) lit.add(key(p)); });
[...accessory, ...feet, ...tail].forEach(p => lit.add(key(p)));

// Ausschnitt auf die Kreatur statt des ganzen 16x16-Rasters: sie belegt nur x 4..12 / y 4..14
// und ging im vollen Raster als Form unter.
const X0 = 4, X1 = 12, Y0 = 3, Y1 = 15;
const COLS = X1 - X0 + 1, ROWS = Y1 - Y0 + 1;

const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const cell = Math.min(cv.width / COLS, cv.height / ROWS);
const offX = (cv.width  - cell * COLS) / 2;
const offY = (cv.height - cell * ROWS) / 2;
const r = cell * 0.37;

for (let y = Y0; y <= Y1; y++) {
  for (let x = X0; x <= X1; x++) {
    const on = lit.has(x + ',' + y);
    ctx.beginPath();
    ctx.arc(offX + (x - X0 + .5) * cell, offY + (y - Y0 + .5) * cell, r, 0, Math.PI * 2);
    ctx.fillStyle = on ? '#F3F1EA' : '#191919';
    ctx.fill();
  }
}
</script>
</body>
</html>
