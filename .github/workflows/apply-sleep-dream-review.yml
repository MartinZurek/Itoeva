name: Apply sleep dream review fixes
on: [push]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/sleep-dreams
          fetch-depth: 0
      - name: Apply review fixes
        run: python tools/maintenance/fix_sleep_dream_review.py
      - name: Commit reviewed sources
        run: |
          rm -f .github/workflows/apply-sleep-dream-review.yml
          rm -f tools/maintenance/fix_sleep_dream_review.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Address sleep and dream review findings"
          git push origin feature/sleep-dreams
