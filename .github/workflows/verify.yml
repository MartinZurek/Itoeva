# Prueflauf fuer jeden Stand, der eingecheckt wird.
#
# Der Grundsatz: was hier laeuft, laeuft auch lokal mit EINEM Befehl - `./gradlew verify`.
# Die Stufen sind deshalb nicht hier einzeln aufgezaehlt, sondern im Wurzel-build.gradle.kts
# definiert. Zwei Listen, die auseinanderlaufen koennen, sind schlimmer als keine CI.
#
# Was hier ZUSAETZLICH steht, ist nur das, was sich lokal nicht sinnvoll nachstellen laesst:
# ein frischer Emulator fuer die Room-Migrationstests, und der Nachweis, dass der Release-
# Torwaechter wirklich zubeisst.

name: Verify

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# Ein neuer Push macht den laufenden Prueflauf desselben Branches gegenstandslos - abbrechen
# statt beide zu Ende rechnen zu lassen.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

env:
  # Bewusst das dokumentierte MINDEST-JDK und nicht das neueste: die Untergrenze aus
  # build.gradle.kts soll hier tatsaechlich erprobt werden. Laeuft der Build nur noch unter 21,
  # ist das ein Fehler in der Dokumentation und soll hier auffallen.
  JAVA_VERSION: '17'

jobs:

  # ---------------------------------------------------------------------------------------
  # **Was ist ueberhaupt betroffen?** Ein billiger Vorlauf (unter einer Minute), der den
  # teuren Jobs erspart, fuer eine reine Textaenderung anzuspringen.
  #
  # Anlass war handfest: Am 21.08.2026 war das Actions-Kontingent des Monats aufgebraucht und
  # die Evolutionskette stand zwoelf Laeufe lang still. Nachgerechnet an den Job-Laufzeiten
  # kostete EIN Prueflauf rund 26 Minuten (GitHub rundet jeden Job einzeln auf volle Minuten
  # auf, auch parallele) - und weil dieser Workflow an `pull_request` UND an `push` haengt,
  # fielen sie je Evolution zweimal an. Aufgaben wie ITO-0004 oder ITO-0009 aendern aber nur
  # einen Satz in zwei strings.xml, und Backlog-Pflege aendert ueberhaupt nur Markdown.
  #
  # **Warum kein `paths-ignore` am Trigger.** Dann liefe der Workflow gar nicht und die Checks
  # verschwaenden aus dem Pull Request. Ueber `if` bleiben sie sichtbar und enden als
  # "skipped" - so, wie es "Signiertes AAB" bei jedem PR ohnehin schon tut.
  #
  # **Im Zweifel wird geprueft.** Laesst sich der Vergleichsstand nicht bestimmen (erster Push
  # eines Branches, Force-Push, `workflow_dispatch`), gilt alles als betroffen. Ein
  # ueberfluessiger Prueflauf kostet Minuten, ein uebersprungener kostet die Zusicherung.
  # ---------------------------------------------------------------------------------------
  changes:
    name: Betroffene Bereiche bestimmen
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      app_code: ${{ steps.filter.outputs.app_code }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Beide Enden des Vergleichs muessen im Klon liegen, nicht nur die Spitze.
          fetch-depth: 0

      - id: filter
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail

          BASE=""; HEAD=""
          case "$EVENT" in
            pull_request) BASE="$PR_BASE";    HEAD="$PR_HEAD" ;;
            push)         BASE="$PUSH_BEFORE"; HEAD="$PUSH_AFTER" ;;
          esac

          # Der Nullhash steht fuer "es gab vorher nichts" (neuer Branch); ein leerer Wert
          # fuer einen Anlass ohne Vergleichspunkt (workflow_dispatch).
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BASE^{commit}" 2>/dev/null \
             || ! git cat-file -e "$HEAD^{commit}" 2>/dev/null; then
            echo "Kein brauchbarer Vergleichsstand ($EVENT, base='$BASE') - es wird alles geprueft."
            echo "app_code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CHANGED="$(git diff --name-only "$BASE" "$HEAD")"
          echo "Geaenderte Dateien:"; printf '  %s\n' $CHANGED

          # Was NICHT in die App gebaut wird. Alles Uebrige gilt als App-Code - eine
          # Positivliste muesste man bei jeder neuen Dateiart nachziehen und waere genau dann
          # falsch, wenn es darauf ankommt.
          REST="$(printf '%s\n' "$CHANGED" | grep -vE '(\.md$|^evolutions/|^store/|^\.gitignore$|^LICENSE)' || true)"

          if [ -n "$(printf '%s' "$REST" | tr -d '[:space:]')" ]; then
            echo "App-Code betroffen:"; printf '  %s\n' $REST
            echo "app_code=true" >> "$GITHUB_OUTPUT"
          else
            echo "Nur Text/Doku/Backlog - die teuren Jobs werden uebersprungen."
            echo "app_code=false" >> "$GITHUB_OUTPUT"
          fi

  # ---------------------------------------------------------------------------------------
  # Unit-Tests, Lint und minifizierter Probe-Bau beider Apps. Braucht kein Geraet, keine
  # Geheimnisse - laeuft daher auch fuer Pull Requests aus Forks.
  # ---------------------------------------------------------------------------------------
  verify:
    name: Tests, Lint, R8
    needs: changes
    if: needs.changes.outputs.app_code == 'true'
    runs-on: ubuntu-latest
    # Gemessen in Lauf #20: 16,6 min bei weitgehend kaltem Gradle-Cache. 40 Minuten lassen
    # reichlich Reserve fuer langsamere Runner, wachsende Testmengen und einen Lauf ganz ohne
    # Cache - und begrenzen einen Haenger trotzdem auf ein Elftel des GitHub-Standards von
    # sechs Stunden.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: gradle/actions/setup-gradle@v4

      # Das Glyph Matrix SDK ist eine AAR, die Nothing nicht ueber ein Maven-Repository
      # ausliefert; sie liegt deshalb unter app/libs/ und ist nicht eingecheckt (siehe
      # app/libs/README.txt). Ohne sie laesst sich :app gar nicht konfigurieren - fuer die
      # Pruefstufe genuegt eine leere Platzhalter-AAR, denn geprueft wird hier die eigene
      # Kompilierung, nicht das SDK.
      - name: Platzhalter fuer das Glyph-SDK anlegen, falls nicht vorhanden
        run: |
          if [ ! -f app/libs/glyphsdk.aar ]; then
            echo "::warning::app/libs/glyphsdk.aar fehlt - lege leeren Platzhalter an."
            mkdir -p app/libs
            printf 'PK\005\006%.0s' 1 | head -c 22 > app/libs/glyphsdk.aar
          fi

      - name: gradlew verify
        run: ./gradlew verify --stacktrace

      # Berichte auch dann einsammeln, wenn der Schritt davor fehlgeschlagen ist - gerade dann
      # sind sie interessant.
      - name: Berichte sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            **/build/reports/**
            **/build/test-results/**
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------------------
  # Der Nachweis, dass `validateRelease` wirklich abbricht.
  #
  # Ohne diesen Schritt bliebe unbemerkt, wenn die Verdrahtung an die Paketier-Tasks eines
  # Tages nicht mehr greift (die Task-Namen gehoeren AGP, nicht uns - siehe die Begruendung
  # in app-sim/build.gradle.kts). Der Torwaechter waere dann still wirkungslos, und genau das
  # soll nicht passieren koennen.
  # ---------------------------------------------------------------------------------------
  release-gate:
    name: Release-Torwaechter beisst
    needs: changes
    # Auch dieser Job haengt am Vorlauf, obwohl er mit rund einer Minute der billigste ist:
    # Eine Aenderung an einer Markdown-Datei kann die Verdrahtung des Torwaechters nicht
    # loesen, und ein Job, der nichts pruefen kann, sollte nicht laufen.
    if: needs.changes.outputs.app_code == 'true'
    runs-on: ubuntu-latest
    # Gemessen: 0,9 min in Lauf #20, 3,4 min in Lauf #19 mit kaltem Cache. Der Job soll am
    # Torwaechter scheitern, bevor R8 ueberhaupt anlaeuft, bleibt also kurz. 15 Minuten sind
    # das Vierfache des schlechtesten beobachteten Werts.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: gradle/actions/setup-gradle@v4

      - name: bundleRelease muss ohne Schluessel scheitern
        run: |
          if ./gradlew :app-sim:bundleRelease --quiet 2>build-error.txt; then
            echo "::error::bundleRelease ist ohne keystore.properties durchgelaufen."
            echo "Der Release-Torwaechter greift nicht mehr - siehe validateRelease"
            echo "in app-sim/build.gradle.kts."
            exit 1
          fi
          if ! grep -q "nicht veroeffentlichungsfaehig" build-error.txt; then
            echo "::error::bundleRelease ist gescheitert, aber nicht am Torwaechter."
            cat build-error.txt
            exit 1
          fi
          echo "Torwaechter hat wie erwartet abgebrochen."

  # ---------------------------------------------------------------------------------------
  # Instrumentierte Tests: Room-Migrationen und die Transaktionszusagen der DAOs. Sie muessen
  # gegen echtes SQLite laufen (Room fuehrt dabei wirklich ein ALTER TABLE aus), brauchen also
  # einen Emulator und laufen deshalb getrennt von der schnellen Stufe oben.
  #
  # Zwei Laeufe, weil die Module verschiedene Untergrenzen haben:
  #
  # - **:app-sim auf API 26** - sein minSdk und damit der aelteste Stand, auf dem eine Migration
  #   ueberhaupt stattfinden kann. Genau dort liegt das Risiko.
  # - **:app auf API 35** - dieses Modul setzt minSdk 34 voraus (Glyph Matrix SDK), auf API 26
  #   liesse es sich gar nicht installieren.
  #
  # `fail-fast: false`, damit ein Fehlschlag im einen Modul den anderen Lauf nicht abwuergt -
  # bei Migrationen will man wissen, ob es beide trifft oder nur eines.
  # ---------------------------------------------------------------------------------------
  #
  # **Zweimal dieselbe Pruefung war einmal zu viel.** Dieser Workflow haengt an
  # `pull_request` und an `push`. Beim Merge eines Pull Requests feuerte damit beides: einmal
  # gegen die Merge-Vorschau, kurz darauf noch einmal gegen den entstandenen Merge-Commit.
  # Geprueft wird dabei derselbe Baum - GitHub laesst Pull-Request-Laeufe bereits gegen die
  # Zusammenfuehrung laufen, nicht gegen den Branch allein. Die Emulator-Laeufe (mit rund elf
  # Minuten der teuerste Posten) entfallen deshalb beim Push; Tests, Lint und R8 laufen
  # weiterhin, weil sie den Merge-Commit als solchen absichern.
  #
  # Die Annahme dahinter ist, dass main ueber Pull Requests waechst. Ein direkter Push auf
  # main umginge diese Pruefung - dann fehlt sie bewusst, nicht versehentlich.
  migrations:
    name: Instrumentiert (${{ matrix.module }}, API ${{ matrix.api-level }})
    needs: changes
    if: needs.changes.outputs.app_code == 'true' && github.event_name != 'push'
    runs-on: ubuntu-latest
    # Ein haengender Emulator wuerde sonst bis zum GitHub-Standard von sechs Stunden
    # weiterlaufen und entsprechend Actions-Minuten verbrauchen. Ein gesunder Lauf bleibt
    # deutlich darunter, auch mit dem langsameren API-26-Image.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Das Target gehoert in die Matrix, weil es nicht fuer beide Zeilen dasselbe sein
          # kann: ATD-Images ("Automated Test Device") gibt es erst ab API 30. Fuer API 26
          # ist "default" - reines AOSP ohne Google-Bestandteile - das naechstliegende
          # verfuegbare Aequivalent zu aosp_atd.
          - module: ':app-sim'
            api-level: 26
            target: default
          - module: ':app'
            api-level: 35
            target: aosp_atd
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: gradle/actions/setup-gradle@v4

      # Ohne KVM laeuft der Emulator in Software und ist zu langsam, um brauchbar zu sein.
      - name: KVM freigeben
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # :app braucht die SDK-AAR schon zum Konfigurieren - siehe die Begruendung im ersten Job.
      - name: Platzhalter fuer das Glyph-SDK anlegen, falls nicht vorhanden
        run: |
          if [ ! -f app/libs/glyphsdk.aar ]; then
            mkdir -p app/libs
            printf 'PK\005\006%.0s' 1 | head -c 22 > app/libs/glyphsdk.aar
          fi

      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: ${{ matrix.target }}
          disable-animations: true
          script: ./gradlew ${{ matrix.module }}:connectedDebugAndroidTest

      - name: Berichte sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-reports-api${{ matrix.api-level }}
          path: '**/build/reports/androidTests/**'
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------------------
  # Das echte, signierte Release-Paket.
  #
  # Laeuft nur von Hand und nur, wenn die Geheimnisse hinterlegt sind - ein Prueflauf, der
  # ohne sie rot wird, wuerde sonst bei jedem Push stoeren und irgendwann ignoriert.
  #
  # Einzurichten unter Settings > Secrets and variables > Actions:
  #   KEYSTORE_BASE64    - der Upload-Keystore, base64-kodiert (`base64 -w0 upload-keystore.jks`)
  #   KEYSTORE_PASSWORD  - Passwort des Keystores
  #   KEY_ALIAS          - Alias des Schluessels
  #   KEY_PASSWORD       - Passwort des Schluessels
  # ---------------------------------------------------------------------------------------
  release:
    name: Signiertes AAB
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Bewusst grosszuegig: dieser Job lief noch nie durch, es gibt also keinen Messwert. Er
    # baut ein vollstaendiges signiertes AAB samt R8; zum Vergleich schaffte verify beide
    # assembleReleaseCheck plus alle Tests und Lint in 16,6 min. 30 Minuten sollten reichen
    # und deckeln den Fehlerfall trotzdem.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: gradle/actions/setup-gradle@v4

      - name: Signaturdaten herstellen
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Kein KEYSTORE_BASE64 hinterlegt - ohne Upload-Schluessel kein Release."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > upload-keystore.jks
          cat > keystore.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: bundleRelease
        run: ./gradlew :app-sim:bundleRelease

      # Der Torwaechter prueft, dass Signaturdaten VORHANDEN sind. Hier wird geprueft, dass sie
      # auch angekommen sind - ein unsigniertes AAB weist der Play Store erst beim Hochladen ab.
      - name: Signatur nachweisen
        run: |
          AAB=app-sim/build/outputs/bundle/release/app-sim-release.aab
          test -f "$AAB" || { echo "::error::$AAB wurde nicht erzeugt."; exit 1; }
          unzip -l "$AAB" | grep -q "META-INF/.*\.RSA\|META-INF/.*\.EC" \
            || { echo "::error::Das AAB traegt keine Signatur."; exit 1; }
          echo "Signatur vorhanden."

      - name: Schluesselreste entfernen
        if: always()
        run: rm -f upload-keystore.jks keystore.properties

      - uses: actions/upload-artifact@v4
        with:
          name: app-sim-release-aab
          path: app-sim/build/outputs/bundle/release/*.aab
