name: Generate Itoeva Music

on:
  workflow_dispatch:
    inputs:
      track_id:
        description: Track id from music/manifest.json
        required: true
        default: home-evening-01
        type: string
      create_pr:
        description: Put the generated audio into app-sim and open a PR
        required: true
        default: true
        type: boolean
      seed:
        description: Optional seed instead of the manifest's (best-of-N candidate takes)
        required: false
        default: ''
        type: string
      candidate:
        description: Push the take to a candidates/ branch without opening a PR (best-of-N)
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    name: Generate music from open weights
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate track without model download
        env:
          TRACK_ID: ${{ inputs.track_id }}
        run: >-
          python tools/music/generate_music.py
          --track-id "$TRACK_ID"
          --dry-run

      - name: Require free Hugging Face model access
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::error::Missing repository secret HF_TOKEN. Accept the Stable Audio 3 Small Music model terms on Hugging Face and add a read token. No Stability API key is required."
            exit 1
          fi

      - name: Resolve pinned Stable Audio runtime
        id: runtime
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest = json.loads(Path('music/manifest.json').read_text(encoding='utf-8'))
          commit = manifest['inference_library_commit']
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
              out.write(f"commit={commit}\n")
          PY

      - name: Install CPU Stable Audio 3 runtime
        env:
          RUNTIME_COMMIT: ${{ steps.runtime.outputs.commit }}
          PIP_NO_CACHE_DIR: '1'
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install \
            --index-url https://download.pytorch.org/whl/cpu \
            torch==2.7.1 torchaudio==2.7.1
          python -m pip install \
            "git+https://github.com/Stability-AI/stable-audio-3.git@${RUNTIME_COMMIT}"
          # Schreibt Ogg/Vorbis - torchaudio deckt das je nach Backend nicht zuverlaessig ab.
          python -m pip install "soundfile==0.13.1"

      - name: Generate track locally on runner
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          TRACK_ID: ${{ inputs.track_id }}
          SEED: ${{ inputs.seed }}
          CI: 'true'
        run: |
          set -euo pipefail
          seed_args=()
          if [ -n "$SEED" ]; then
            case "$SEED" in (*[!0-9]*) echo "::error::seed must be a non-negative integer"; exit 1;; esac
            seed_args=(--seed "$SEED")
          fi
          python tools/music/generate_music.py \
            --track-id "$TRACK_ID" \
            --device cpu \
            --output-dir generated/music \
            "${seed_args[@]}"

      - name: Resolve generated filenames
        id: track
        env:
          TRACK_ID: ${{ inputs.track_id }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest = json.loads(Path('music/manifest.json').read_text(encoding='utf-8'))
          track = next(t for t in manifest['tracks'] if t['id'] == os.environ['TRACK_ID'])
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
              out.write(f"resource={track['android_resource']}\n")
              out.write(f"format={track['output_format']}\n")
          PY

      - name: Keep generated track as workflow artifact
        # `always()`, damit eine Datei, die den Gate-Check in generate_music.py nicht besteht,
        # trotzdem zum Nachhoeren/Analysieren hochgeladen wird statt mit dem fehlgeschlagenen Job
        # verworfen zu werden - genau das fehlte am 2026-09-23, als vier Laeufe am Clipping-Gate
        # scheiterten und die Ursache mangels Artefakt nicht am tatsaechlichen Signal geprueft
        # werden konnte. `warn` statt `error`, weil ein frueherer Schritt (Modell laden, Praeflug)
        # scheitern kann, bevor ueberhaupt eine Datei entsteht.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: itoeva-music-${{ inputs.track_id }}-${{ github.run_id }}
          path: generated/music/*
          if-no-files-found: warn
          retention-days: 30

      - name: Create game-asset branch and pull request
        if: ${{ success() && (inputs.create_pr || inputs.candidate) }}
        env:
          # **Dieselbe Sperre wie in claude-primary-run.yml** - siehe die ausfuehrliche
          # Begruendung am Schritt "Pull Request eroeffnen" dort und PR #95.
          #
          # Ein mit `github.token` eroeffneter Pull Request gehoert github-actions[bot], und
          # GitHub laesst dessen Ereignisse aus Rekursionsschutz nicht frei laufen. PR #98 - der
          # erzeugte Track main-day-02 - hatte deshalb NULL Pruefungen: nicht rot, nicht gruen,
          # gar keine.
          #
          # Das ist die Luecke, die PR #95 offen gelassen hat: Dort wurde der eine Workflow
          # repariert und dieser hier uebersehen, obwohl er denselben Fehler enthielt. Ein PR,
          # der eine Binaerdatei in `res/raw` legt, ist genau der Fall, in dem eine ungeprueft
          # durchgereichte Aenderung teuer wird.
          GH_TOKEN: ${{ secrets.EVOLUTION_PR_TOKEN || github.token }}
          EIGENES_PR_TOKEN: ${{ secrets.EVOLUTION_PR_TOKEN != '' }}
          TRACK_ID: ${{ inputs.track_id }}
          RESOURCE: ${{ steps.track.outputs.resource }}
          FORMAT: ${{ steps.track.outputs.format }}
          SEED: ${{ inputs.seed }}
          CANDIDATE: ${{ inputs.candidate }}
        run: |
          set -euo pipefail

          safe_track_id="${TRACK_ID//[^a-zA-Z0-9._-]/-}"
          if [ "$CANDIDATE" = "true" ]; then
            # Best-of-N: jeder Kandidat liegt auf einem eigenen Branch, ohne PR. Der Gewinner
            # (tools/music/best_take.py) bekommt seinen PR danach aus genau diesem Branch.
            branch="candidates/music-${safe_track_id}-s${SEED:-manifest}-${GITHUB_RUN_ID}"
          else
            branch="generated/music-${safe_track_id}-${GITHUB_RUN_ID}"
          fi
          audio="generated/music/${RESOURCE}.${FORMAT}"
          metadata="generated/music/${RESOURCE}.json"
          target="app-sim/src/main/res/raw/${RESOURCE}.${FORMAT}"
          provenance="music/generated/${safe_track_id}.json"

          test -s "$audio"
          test -s "$metadata"

          git switch -c "$branch"
          mkdir -p app-sim/src/main/res/raw music/generated
          cp "$audio" "$target"
          cp "$metadata" "$provenance"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$SEED" ]; then
            # Der ueberschriebene Seed gehoert ins Manifest desselben Commits - sonst erzeugte
            # eine Neuerzeugung nach dem Merge einen anderen Take als den gehoerten.
            python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path('music/manifest.json')
          manifest = json.loads(path.read_text(encoding='utf-8'))
          for track in manifest['tracks']:
              if track['id'] == os.environ['TRACK_ID']:
                  track['seed'] = int(os.environ['SEED'])
          path.write_text(json.dumps(manifest, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY
            git add music/manifest.json
          fi
          git add "$target" "$provenance"
          git commit -m "Add generated Itoeva track ${TRACK_ID}${SEED:+ (seed $SEED)}"
          git push --set-upstream origin "$branch"

          if [ "$CANDIDATE" = "true" ]; then
            echo "Candidate take pushed to $branch - no pull request (best-of-N)."
            exit 0
          fi

          if [ "${EIGENES_PR_TOKEN}" != "true" ]; then
            echo "::warning::EVOLUTION_PR_TOKEN fehlt oder heisst anders. Der Pull Request gehoert damit github-actions[bot], und seine Pruefungen starten nicht - im Actions-Tab ist dann 'Approve and run' noetig."
          fi
          gh pr create \
            --base main \
            --head "$branch" \
            --title "Music: add generated track ${TRACK_ID}" \
            --body "Generated locally from Stable Audio 3 open weights using the versioned Itoeva manifest and prompt. No Stability API credits were used. Audio and provenance metadata are included. Please listen before merging; generated media is never auto-merged."
