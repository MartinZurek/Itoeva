name: Apply strict football skill gating

on:
  push:
    branches:
      - 'evolution/contextual-football-intent'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: evolution/contextual-football-intent
          fetch-depth: 0

      - name: Apply strict gating patch
        run: python .github/contextual_football_touch.py

      - name: Check patch
        run: |
          git diff --check
          git diff --stat

      - name: Commit patch and remove helpers
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/contextual-football-touch.yml .github/contextual_football_touch.py
          git add app-sim/src/main/java/com/notime/glyphsim/matrix/PlayEffects.kt app-sim/src/main/java/com/notime/glyphsim/skilltree/AvatarActivity.kt app-sim/src/test/java/com/notime/glyphsim/skilltree/AvatarActivityPlansTest.kt
          git commit -m 'Gate football dribbling behind its unlock'
          git push origin HEAD:evolution/contextual-football-intent
