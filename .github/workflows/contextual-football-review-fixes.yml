name: Apply contextual football review fixes

on:
  push:
    branches:
      - 'evolution/contextual-football-intent'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: evolution/contextual-football-intent
          fetch-depth: 0

      - name: Apply review fixes
        run: python .github/scripts/contextual_football_review_fixes.py

      - name: Check patch
        run: |
          git diff --check
          git diff --stat
          if grep -R "avatarLevel" app-sim/src/main/java/com/notime/glyphsim/skilltree/AvatarActivity.kt app-sim/src/test/java/com/notime/glyphsim/skilltree/AvatarActivityPlansTest.kt; then
            echo "Unexpected avatarLevel dependency remains"
            exit 1
          fi

      - name: Commit review fixes and remove helpers
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/contextual-football-review-fixes.yml
          git rm .github/scripts/contextual_football_review_fixes.py
          git rm evolutions/.contextual-football-review-trigger
          git add \
            app-sim/src/main/java/com/notime/glyphsim/skilltree/AvatarActivity.kt \
            app-sim/src/main/java/com/notime/glyphsim/skilltree/SkillRepertoire.kt \
            app-sim/src/main/java/com/notime/glyphsim/ui/DockScreen.kt \
            app-sim/src/test/java/com/notime/glyphsim/skilltree/AvatarActivityPlansTest.kt \
            app-sim/src/test/java/com/notime/glyphsim/skilltree/SkillRepertoireTest.kt \
            EVOLUTION.md SKILLBAUM.md
          git commit -m 'Address contextual football review findings'
          git push origin HEAD:evolution/contextual-football-intent
