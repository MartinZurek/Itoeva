# Bestehender Godot-APK-Lieferweg aus Martins Auftrag vom19.10.2026;
# Ganzkoerperbewegung und Starlits Schwebe-Huepfen aus Martins Auftrag vom22.10.2026.
# AndroidTest und DEBUG_KEYSTORE_BASE64; ersetzt die freigegebene Drive-Zieldatei.
# 0.15.6: HD-2D-Pixelfassung der vier Spielfiguren (Martins Auftrag vom 26.10.2026).
name: Godot Test APK 0.15.6

# Kein automatischer Bau bei Push: Test-APKs erst nach Martins Freigabe der Vorschauen.
# Fuer eine Lieferung hier den Liefer-Branch eintragen oder den Lauf manuell starten.
on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: godot-test-apk-v0156
  # Neuere Korrekturen ersetzen veraltete Testbauten vor der Drive-Auslieferung.
  cancel-in-progress: true

env:
  GODOT_VERSION: '4.5.1'
  PROJECT: prototypes/godot-hd2d
  APK_NAME: Itoeva_Godot_Test_v0.15.6.apk
  FILE_ID: 148Ls55fl4-I8OUqRlMlFUSy7-PT75wLX

jobs:
  apk:
    name: Godot testen, AndroidTest bauen und nach Drive legen
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Laufzeitdateien gegen 0.15.6-Manifest pruefen
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          project = pathlib.Path(os.environ['PROJECT'])
          manifest = json.loads(pathlib.Path('docs/godot-v0156-runtime-manifest.json').read_text())
          assert manifest['sha256'] == '7150b550974a81a2a9ddcdee7f88a311b289fc6fb21afccf9d5fbfa1ff35c9fa'
          canonical = ''.join(item['path'] + '\0' + item['sha256'] + '\n' for item in manifest['files']).encode()
          assert hashlib.sha256(canonical).hexdigest() == manifest['sha256']
          assert len(manifest['files']) == 577
          for item in manifest['files']:
              data = (project / item['path']).read_bytes()
              assert len(data) == item['bytes'], item['path']
              assert hashlib.sha256(data).hexdigest() == item['sha256'], item['path']
          import base64, zlib
          masks = json.loads((project / 'data/environment_masks.json').read_text())
          ambient = json.loads((project / 'data/ambience.json').read_text())
          forest = json.loads((project / 'data/forest_trail.json').read_text())
          entries = dict(ambient['assets'])
          entries['forest:SHADOW_BROOK'] = dict(size=[1,1], water=forest['water'], exclude=forest.get('water_exclude',[]))
          source = json.dumps(entries,sort_keys=True,separators=(',',':'),ensure_ascii=False).encode()
          assert masks['source_sha256'] == hashlib.sha256(source).hexdigest()
          for entry in masks['masks'].values():
              raw = zlib.decompress(base64.b64decode(entry['deflate']))
              assert len(raw) == entry['width'] * entry['height'] * 2 == entry['bytes']
              assert hashlib.sha256(raw).hexdigest() == entry['sha256']
          print('577 Laufzeit-/Exportdateien (inkl. 28 Pixelfassungen, ohne 3D-Figuren) und 29 Dynamikmasken stimmen bytegenau mit v0.15.6 ueberein.')
          PY

      - name: Gemalte Mooslyn-Phasen pruefen
        run: |
          python3 -m pip install numpy==2.2.6 Pillow==11.3.0
          python3 -m unittest discover -s "$PROJECT/tests" -p test_mosslyn_painted_assets.py

      - name: Technische Gangfelder pruefen
        run: python3 -m unittest discover -s "$PROJECT/tests" -p test_gait_registration.py

      - name: Schrittmasken und umkehrbare Beinabbildung pruefen
        run: python3 -m unittest discover -s "$PROJECT/tests" -p test_step_rigs.py

      - name: Godot und Export-Templates (Cache)
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}

      - name: Godot und Export-Templates laden
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p ~/godot
          cd ~/godot
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl --retry 3 -fsSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -qo godot.zip
          rm godot.zip
          curl --retry 3 -fsSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -qo templates.tpz
          rm templates.tpz
          find templates -type f ! -name 'android_*' ! -name 'version.txt' -delete

      - name: Godot einrichten
        run: |
          set -euo pipefail
          tdir="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$tdir" ~/.config/godot
          cp -r ~/godot/templates/. "$tdir/"
          echo "GODOT=$HOME/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" >> "$GITHUB_ENV"
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          for f in editor_settings-4.tres editor_settings-4.5.tres; do
            {
              echo '[gd_resource type="EditorSettings" format=3]'
              echo
              echo '[resource]'
              echo "export/android/android_sdk_path = \"$sdk\""
              echo "export/android/java_sdk_path = \"$JAVA_HOME\""
            } > "$HOME/.config/godot/$f"
          done

      - name: Godot importieren und Regressionen pruefen
        run: |
          set -euo pipefail
          mkdir -p "$PROJECT/build"
          timeout 600 "$GODOT" --headless --editor --path "$PROJECT" --import --quit \
            2>&1 | tee "$PROJECT/build/import.log"
          for test in step_contacts route_connections stamina_motion character_polish polish_v062 strategy_rules strategy_ui strategy_benchmark card_model card_rules special_rules victory_flow \
                      card_ui minion_ui forest_trail card_playthrough full_smoke full_framing full_doors expanded_cards expanded_card_ui ambience_coordinates battle_feedback_audio inhabited_world_v070 landscape_depth_v071 demons_v080 ecology_boss_v090 ecology_playthrough_v090 enemy_roaming roaming_and_slopes combat_motion_light; do
            timeout 300 "$GODOT" --headless --fixed-fps 60 --path "$PROJECT" \
              --script "res://tests/${test}.gd" 2>&1 | tee "$PROJECT/build/${test}.log"
            ! grep -qE "SCRIPT ERROR|Parse Error|Compile Error" "$PROJECT/build/${test}.log"
          done

      - name: Gemalte Helfer und 40-Karten-Deckeditor rendern
        run: |
          set -euo pipefail
          timeout 300 xvfb-run -a "$GODOT" --audio-driver Dummy --rendering-driver opengl3 --fixed-fps 60 --path "$PROJECT" \
            --script res://tests/helpers_capture_v060.gd 2>&1 | tee "$PROJECT/build/visual.log"

      - name: Feuer und Figurenlicht visuell pruefen
        run: |
          set -euo pipefail
          for test in mosslyn_painted_cycles gait_review environment_render ambience_render forest_render firelight_render firelight_capture battle_feedback_capture polish_capture_v062 inhabited_capture_v070 depth_capture_v071 demon_capture_v080 ecology_capture_v090 combat_motion_capture character_polish_capture motion_regions stamina_capture route_capture; do
            timeout 300 xvfb-run -a "$GODOT" --audio-driver Dummy --rendering-driver opengl3 --fixed-fps 60 --path "$PROJECT" \
              --script "res://tests/${test}.gd" 2>&1 | tee "$PROJECT/build/${test}.log"
            ! grep -qE "SCRIPT ERROR|Parse Error|Compile Error" "$PROJECT/build/${test}.log"
          done

      - name: Neue Karten und Beschwoerungen rendern
        run: |
          set -euo pipefail
          timeout 300 xvfb-run -a "$GODOT" --audio-driver Dummy --rendering-driver opengl3 --fixed-fps 60 --path "$PROJECT" \
            --script res://tests/strategy_ui.gd -- --capture 2>&1 | tee "$PROJECT/build/strategy-render.log"
          ! grep -qE "SCRIPT ERROR|Parse Error|Compile Error" "$PROJECT/build/strategy-render.log"

      - name: Hinterlegten Debug-Schluessel einrichten
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          [ -n "$DEBUG_KEYSTORE_BASE64" ] || { echo '::error::DEBUG_KEYSTORE_BASE64 fehlt.'; exit 1; }
          umask 077
          ks="$RUNNER_TEMP/godot-test-debug.keystore"
          printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 -d > "$ks"
          {
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$ks"
            echo 'GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey'
            echo 'GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android'
          } >> "$GITHUB_ENV"

      - name: AndroidTest exportieren und APK pruefen
        run: |
          set -euo pipefail
          apk="$GITHUB_WORKSPACE/$PROJECT/build/$APK_NAME"
          "$GODOT" --headless --path "$PROJECT" --export-debug AndroidTest "$apk" \
            2>&1 | tee "$PROJECT/build/export.log"
          test -s "$apk"
          unzip -tq "$apk"
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          bt="$(find "$sdk/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$bt/apksigner" verify --verbose --print-certs "$apk" | tee "$PROJECT/build/signature.txt"
          grep -F '30dbcf9daa7c26e4f76a1c2da674ee8b5e732186a058081e2dabd34eb82d58dc' "$PROJECT/build/signature.txt"
          "$bt/aapt" dump badging "$apk" > "$PROJECT/build/package.txt"
          grep "^package: name='com.itoeva.godot.hd2d.worldtest' versionCode='36' versionName='0.15.6'" "$PROJECT/build/package.txt"
          grep "^native-code: 'arm64-v8a'$" "$PROJECT/build/package.txt"
          if grep -q "android.permission.INTERNET" "$PROJECT/build/package.txt"; then
            echo '::error::Unerwartete Internetberechtigung.'
            exit 1
          fi
          (cd "$PROJECT/build" && sha256sum "$APK_NAME" > "$APK_NAME.sha256")
          python3 - <<'PY'
          import hashlib, json, os, pathlib, zipfile
          apk = pathlib.Path(os.environ['PROJECT']) / 'build' / os.environ['APK_NAME']
          data = apk.read_bytes()
          with zipfile.ZipFile(apk) as archive:
              catalog_path = [name for name in archive.namelist() if name.endswith("data/strategy_cards.json")]
              assert len(catalog_path) == 1, catalog_path
              catalog = json.loads(archive.read(catalog_path[0]))
          with zipfile.ZipFile(apk) as archive:
              names = archive.namelist()
              for stem in ['fennec-v2', 'gloop-v2', 'puffling-v2', 'hootlet-v2', 'starlet-v2', 'wyrmling-v2', 'nocti-flight', 'mosslyn-run'] + [species + '-walk' for species in ['mosslyn','nocti','starlet','wyrmling','fennec','gloop','puffling','hootlet']]:
                  assert any(stem + '.png' in name for name in names), ('Figur fehlt im APK', stem)
              for stem in ['mosslyn-walk-28', 'mosslyn-run-28']:
                  assert any(stem + '.png' in name for name in names), stem
              for stem in ['mosslyn', 'mosslyn-walk', 'mosslyn-run', 'mosslyn-walk-28', 'mosslyn-run-28', 'nocti', 'nocti-walk', 'nocti-flight', 'starlet-v2', 'starlet-walk', 'wyrmling-v2', 'wyrmling-walk']:
                  assert any(name.endswith('characters/pixel/' + stem + '.png.import') for name in names), ('Pixelfassung fehlt', stem)
              painted_path = [name for name in names if name.endswith('data/mosslyn_painted_cycles.json')]
              assert len(painted_path) == 1
              assert json.loads(archive.read(painted_path[0])) == json.loads((pathlib.Path(os.environ['PROJECT']) / 'data/mosslyn_painted_cycles.json').read_text())
              run_data = [name for name in names if name.endswith('data/character_runs.json')]
              assert len(run_data) == 1, run_data
              assert set(json.loads(archive.read(run_data[0]))) == {'mosslyn', 'nocti'}
              walk_data = [name for name in names if name.endswith('data/character_walks.json')]
              mask_data = [name for name in names if name.endswith('data/character_pose_masks.json')]
              assert len(walk_data) == len(mask_data) == 1
              assert set(json.loads(archive.read(walk_data[0]))) == {'mosslyn','nocti','starlet','wyrmling','fennec','gloop','puffling','hootlet'}
              assert len(json.loads(archive.read(mask_data[0]))) == 18
              forest_path = [name for name in names if name.endswith('data/forest_trail.json')]
              assert len(forest_path) == 1
              forest = json.loads(archive.read(forest_path[0]))
              assert forest['entrance']['at'] == [.9, .55]
              assert len(forest['branches']) == 2
              masks_path = [name for name in names if name.endswith('data/environment_masks.json')]
              assert len(masks_path) == 1
              assert len(json.loads(archive.read(masks_path[0]))['masks']) == 29
              step_path = [name for name in names if name.endswith('data/step_rigs.json')]
              assert len(step_path) == 1
              steps = json.loads(archive.read(step_path[0]))
              assert set(steps) == {'mosslyn','nocti','starlet','wyrmling','fennec','gloop','puffling','hootlet'}
              assert len(steps['wyrmling']['rows'][0]['feet']) == 4
              assert 'flight' in steps['nocti']
              body_path = [name for name in names if name.endswith('data/body_rigs.json')]
              assert len(body_path) == 1
              assert set(json.loads(archive.read(body_path[0]))) == {'mosslyn','nocti','starlet','wyrmling','nocti-flight'}
              assert any('full_body' in name and 'gdshaderinc' in name for name in names)
              assert not any('-3d/' in name or 'mosslyn_volume' in name or 'companion_volume' in name for name in names), '3D-Figurenreste im APK'
          assert len(catalog["cards"]) == 616
          assert len({card["volk"] for card in catalog["cards"].values()}) == 13
          assert all(card["kind"] == "minion" for card in catalog["cards"].values())
          report = dict(commit=os.environ['GITHUB_SHA'], run_id=os.environ['GITHUB_RUN_ID'],
                        file_id=os.environ['FILE_ID'], bytes=len(data),
                        sha256=hashlib.sha256(data).hexdigest(), md5=hashlib.md5(data).hexdigest(),
                        package='com.itoeva.godot.hd2d.worldtest', version='0.15.6', version_code=36, card_count=len(catalog['cards']), starter_species=['mosslyn','nocti','starlet','wyrmling'])
          apk.with_name('build-report.json').write_text(json.dumps(report, indent=2) + '\n')
          print(json.dumps(report, indent=2))
          PY

      - name: Schluesselreste entfernen
        if: always()
        run: rm -f "$RUNNER_TEMP/godot-test-debug.keystore"

      - name: Gepruefte APK als Artefakt sichern
        uses: actions/upload-artifact@v4
        with:
          name: itoeva-godot-v0156-${{ github.sha }}
          path: |
            ${{ env.PROJECT }}/build/${{ env.APK_NAME }}
            ${{ env.PROJECT }}/build/${{ env.APK_NAME }}.sha256
            ${{ env.PROJECT }}/build/build-report.json
            ${{ env.PROJECT }}/build/package.txt
            ${{ env.PROJECT }}/build/signature.txt
          if-no-files-found: error
          retention-days: 14

      - name: Vollstaendige APK per resumable Upload nach Drive legen
        env:
          SA_JSON: ${{ secrets.GDRIVE_SA_JSON }}
        run: |
          set -euo pipefail
          [ -n "$SA_JSON" ] || { echo '::error::GDRIVE_SA_JSON fehlt; APK liegt als Artefakt bereit.'; exit 1; }
          umask 077
          upload_tmp="$(mktemp -d)"
          trap 'rm -rf "$upload_tmp"' EXIT
          printf '%s' "$SA_JSON" > "$upload_tmp/sa.json"
          jwt="$(sh runner/gdrive-jwt.sh "$upload_tmp/sa.json" https://www.googleapis.com/auth/drive)"
          echo "::add-mask::$jwt"
          answer="$(curl --fail-with-body -sS -X POST https://oauth2.googleapis.com/token \
            --data-urlencode 'grant_type=urn:ietf:params:oauth:grant-type:jwt-bearer' \
            --data-urlencode "assertion=$jwt")"
          token="$(printf '%s' "$answer" | jq -r '.access_token // empty')"
          [ -n "$token" ] || { echo '::error::Kein Drive-Zugriffstoken.'; exit 1; }
          echo "::add-mask::$token"
          apk="$PROJECT/build/$APK_NAME"
          bytes="$(stat -c %s "$apk")"
          description="Itoeva Godot Test 0.15.6 (HD-2D-Pixel); Commit $GITHUB_SHA; Lauf $GITHUB_RUN_ID; SHA-256 $(jq -r .sha256 "$PROJECT/build/build-report.json")"
          jq -n --arg description "$description" --arg name "$APK_NAME" '{description:$description,name:$name}' > "$upload_tmp/metadata.json"
          curl --fail-with-body -sS -X PATCH \
            -H "Authorization: Bearer $token" \
            -H 'Content-Type: application/json; charset=UTF-8' \
            -H 'X-Upload-Content-Type: application/vnd.android.package-archive' \
            -H "X-Upload-Content-Length: $bytes" \
            --data-binary @"$upload_tmp/metadata.json" \
            -D "$upload_tmp/headers" -o "$upload_tmp/session.json" \
            "https://www.googleapis.com/upload/drive/v3/files/$FILE_ID?uploadType=resumable&supportsAllDrives=true"
          session="$(awk 'tolower($1)=="location:" {gsub("\r", "", $2); print $2}' "$upload_tmp/headers")"
          [ -n "$session" ] || { echo '::error::Drive lieferte keine Upload-Sitzung.'; exit 1; }
          echo "::add-mask::$session"
          SESSION_URL="$session" ACCESS_TOKEN="$token" python3 - <<'PY'
          import os, pathlib, json, urllib.request, urllib.error, time
          apk = pathlib.Path(os.environ['PROJECT']) / 'build' / os.environ['APK_NAME']
          size = apk.stat().st_size
          headers = {'Authorization': 'Bearer ' + os.environ['ACCESS_TOKEN'],
                     'Content-Type': 'application/vnd.android.package-archive'}
          def request(body, content_range):
              h = dict(headers)
              h['Content-Length'] = str(len(body))
              h['Content-Range'] = content_range
              req = urllib.request.Request(os.environ['SESSION_URL'], data=body, headers=h, method='PUT')
              try:
                  with urllib.request.urlopen(req, timeout=45) as response:
                      return response.status, response.headers, response.read()
              except urllib.error.HTTPError as error:
                  if error.code == 308:
                      return error.code, error.headers, b''
                  raise
          offset = 0
          attempts = 0
          with apk.open('rb') as source:
              while offset < size:
                  source.seek(offset)
                  chunk = source.read(8 * 1024 * 1024)
                  end = offset + len(chunk) - 1
                  try:
                      status, h, body = request(chunk, f'bytes {offset}-{end}/{size}')
                  except (urllib.error.URLError, TimeoutError, OSError):
                      attempts += 1
                      if attempts > 5:
                          raise
                      print('Uebertragung unterbrochen; bestaetigten Offset abfragen.', flush=True)
                      time.sleep(2)
                      try:
                          status, h, body = request(b'', f'bytes */{size}')
                      except (urllib.error.URLError, TimeoutError, OSError):
                          continue
                  if status in (200, 201):
                      assert json.loads(body)['id'] == os.environ['FILE_ID']
                      offset = size
                  elif status == 308:
                      received = h.get('Range', '')
                      next_offset = int(received.rsplit('-', 1)[1]) + 1 if received else 0
                      assert 0 <= next_offset <= size
                      if next_offset > offset:
                          attempts = 0
                      else:
                          attempts += 1
                          if attempts > 5:
                              raise RuntimeError('Keine bestaetigte Upload-Fortsetzung')
                      offset = next_offset
                  else:
                      raise RuntimeError('Unerwarteter Uploadstatus ' + str(status))
                  print(f'Bestaetigte Bytes: {offset}/{size}', flush=True)
          PY
          curl --fail-with-body -sS \
            -H "Authorization: Bearer $token" \
            "https://www.googleapis.com/drive/v3/files/$FILE_ID?supportsAllDrives=true&fields=id,name,size,md5Checksum,sha256Checksum,webViewLink" \
            -o "$PROJECT/build/drive-result.json"
          python3 - <<'PY'
          import json, os, pathlib
          build = pathlib.Path(os.environ['PROJECT']) / 'build'
          local = json.loads((build / 'build-report.json').read_text())
          remote = json.loads((build / 'drive-result.json').read_text())
          assert remote['id'] == os.environ['FILE_ID'], remote
          assert remote['name'] == os.environ['APK_NAME'], remote
          assert int(remote['size']) == local['bytes'], remote
          assert remote['md5Checksum'] == local['md5'], remote
          if remote.get('sha256Checksum'):
              assert remote['sha256Checksum'] == local['sha256'], remote
          summary = (f"APK 0.15.6 / Code 36\n\nCommit: `{local['commit']}`\n\n"
                     f"Groesse: {local['bytes']} Bytes\n\nSHA-256: `{local['sha256']}`\n\n"
                     f"Drive: {remote.get('webViewLink', remote['id'])}\n")
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write(summary)
          print(summary)
          PY

      - name: Build- und Upload-Protokolle sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-v0156-protokolle-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.PROJECT }}/build/*.log
            ${{ env.PROJECT }}/build/*.json
            ${{ env.PROJECT }}/build/*.txt
            ${{ env.PROJECT }}/captures/v090-*.png
            ${{ env.PROJECT }}/captures/combat-motion-*.png
            ${{ env.PROJECT }}/captures/v071-*.png
            ${{ env.PROJECT }}/captures/v070-*.png
            ${{ env.PROJECT }}/captures/firelight-*.png
            ${{ env.PROJECT }}/captures/strategy-*.png
            ${{ env.PROJECT }}/captures/character-polish-*.png
            ${{ env.PROJECT }}/captures/stamina-*.png
            ${{ env.PROJECT }}/captures/environment-motion-*.png
            ${{ env.PROJECT }}/captures/route-*.png
            ${{ env.PROJECT }}/captures/motion-regions/*.png
            ${{ env.PROJECT }}/captures/calm-gait/*.png
          if-no-files-found: ignore
          retention-days: 14
