name: Itoeva Kampfarena APK

on:
  push:
    branches: [codex/kampfarena-apk-20261117]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Godot and Android export tools
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          release=https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable
          curl -fsSL --retry 3 "$release/Godot_v4.6.3-stable_linux.x86_64.zip" -o godot.zip
          curl -fsSL --retry 3 "$release/Godot_v4.6.3-stable_export_templates.tpz" -o templates.tpz
          printf '%s\n' \
            'd0bc2113065e481c9c2c2b2c37daa4e8be3fe9e27f0ab9ab0b6096e9a37907f3  godot.zip' \
            '3fbe2c0e2dec9d537ab9ec97bcf8da91dcf23357fc51f67092dd068d839290a8  templates.tpz' \
            | sha256sum -c -
          unzip -q godot.zip
          install -m 0755 Godot_v4.6.3-stable_linux.x86_64 "$RUNNER_TEMP/godot"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          templates_dir="$HOME/.local/share/godot/export_templates/4.6.3.stable"
          mkdir -p "$templates_dir" "$HOME/.config/godot"
          unzip -j templates.tpz 'templates/android_release.apk' -d "$templates_dir"
          sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.1'
          printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\nexport/android/java_sdk_path = "%s"\nexport/android/android_sdk_path = "%s"\n' \
            "$JAVA_HOME" "$ANDROID_HOME" > "$HOME/.config/godot/editor_settings-4.6.tres"
      - name: Stage the arena and run the duel test
        shell: bash
        run: |
          stage="$RUNNER_TEMP/itoeva-arena"
          python3 tools/stage_duel_lab.py "$stage"
          mkdir "$stage/tests"
          cp tests/duel_lab_play.gd "$stage/tests/"
          sed -i \
            -e 's/com\.itoeva\.kartenschmiede\.lab/com.itoeva.kampfarena.preview/' \
            -e 's/package\/name="Itoeva Kartenschmiede"/package\/name="Itoeva Kampfarena"/' \
            -e 's/version\/code=2/version\/code=3/' \
            -e 's/version\/name="1.0.1"/version\/name="1.0.2"/' \
            "$stage/export_presets.cfg"
          sed -i -e 's/config\/version="1.0.1"/config\/version="1.0.2"/' \
            -e 's/config\/build_number=2/config\/build_number=3/' "$stage/project.godot"
          godot --headless --editor --path "$stage" --import
          timeout 90 godot --headless --path "$stage" --fixed-fps 60 --script res://tests/duel_lab_play.gd \
            2>&1 | tee "$RUNNER_TEMP/duel-test.log"
          grep -F 'Aufstellung, Laufrichtung und Wolfssprung geprüft' "$RUNNER_TEMP/duel-test.log"
          if grep -Eq 'SCRIPT ERROR|Parse Error' "$RUNNER_TEMP/duel-test.log"; then
            exit 1
          fi
      - name: Export, sign and verify the APK
        shell: bash
        run: |
          stage="$RUNNER_TEMP/itoeva-arena"
          templates_dir="$HOME/.local/share/godot/export_templates/4.6.3.stable"
          build_tools="$ANDROID_HOME/build-tools/35.0.1"
          apk="$RUNNER_TEMP/Itoeva_Kampfarena_v1.0.2.apk"
          godot --headless --path "$stage" --export-release Kartenschmiede "$RUNNER_TEMP/unsigned.apk"
          python3 tools/fix_duel_lab_android.py "$RUNNER_TEMP/unsigned.apk" \
            "$templates_dir/android_release.apk" "$RUNNER_TEMP/fixed.apk"
          "$build_tools/zipalign" -P 16 -f 4 "$RUNNER_TEMP/fixed.apk" "$RUNNER_TEMP/aligned.apk"
          keytool -genkeypair -keystore "$RUNNER_TEMP/arena.jks" -storetype JKS \
            -storepass android -keypass android -alias arena-preview \
            -keyalg RSA -keysize 2048 -validity 3650 -dname 'CN=Itoeva Kampfarena Preview'
          "$build_tools/apksigner" sign --ks "$RUNNER_TEMP/arena.jks" --ks-pass pass:android \
            --key-pass pass:android --ks-key-alias arena-preview --out "$apk" "$RUNNER_TEMP/aligned.apk"
          "$build_tools/apksigner" verify --verbose "$apk"
          "$build_tools/zipalign" -c -P 16 4 "$apk"
          "$build_tools/aapt" dump badging "$apk" | tee "$RUNNER_TEMP/badging.log"
          grep -F "package: name='com.itoeva.kampfarena.preview' versionCode='3'" "$RUNNER_TEMP/badging.log"
          grep -F "native-code: 'arm64-v8a'" "$RUNNER_TEMP/badging.log"
          sha256sum "$apk"
      - uses: actions/upload-artifact@v4
        with:
          name: Itoeva_Kampfarena_v1.0.2
          path: ${{ runner.temp }}/Itoeva_Kampfarena_v1.0.2.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
