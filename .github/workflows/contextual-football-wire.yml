name: Apply contextual football wiring

on:
  push:
    branches:
      - 'evolution/contextual-football-intent'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: evolution/contextual-football-intent
          fetch-depth: 0

      - name: Patch DockScreen and evolution history
        run: python .github/contextual_football_wire.py

      - name: Check patch
        run: |
          git diff --check
          git diff --stat

      - name: Commit patch and remove helpers
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/contextual-football-wire.yml .github/contextual_football_wire.py
          git add app-sim/src/main/java/com/notime/glyphsim/ui/DockScreen.kt EVOLUTION.md
          git commit -m 'Wire contextual football intent into play mode'
          git push origin HEAD:evolution/contextual-football-intent
