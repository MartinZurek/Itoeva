name: Verify Music Tooling

on:
  pull_request:
    paths:
      - 'music/**'
      - 'tools/music/**'
      - '.github/workflows/generate-music.yml'
      - '.github/workflows/verify-music-tooling.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dry-run:
    name: Validate versioned music definition
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out proposed revision
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # **Jeden Track im Manifest, nicht einen fest verdrahteten.**
      #
      # Vorher stand hier `--track-id home-evening-01`. Das prueft die Werkzeugkette, aber
      # ausgerechnet nicht den Eintrag, der gerade dazugekommen ist - und neue Eintraege sind der
      # einzige Grund, aus dem diese Datei ueberhaupt jemals anschlaegt. Beim Hinzufuegen von
      # main-day-02 waere ein Tippfehler in Rolle, Ressourcenname oder Prompt-Pfad gruen durch die
      # CI gegangen und erst am stillen Player aufgefallen.
      #
      # Der Dry-Run laedt keine Modellgewichte und braucht kein Secret; er prueft Pflichtfelder,
      # die Rolle gegen SUPPORTED_ROLES und die Erreichbarkeit der Prompt-Datei.
      # Das Freigabe-Gate selbst pruefen, bevor irgendein Track daran gemessen wird. Reines
      # numpy, keine Modellgewichte, kein Secret - und es faellt in Sekunden auf, wenn eine
      # Regel aufgeweicht wird, die drei ausgelieferte Dateien beanstandet haette.
      - name: Install numpy for the audio gate
        run: pip install --quiet numpy

      - name: Test the loop polish and release gate
        run: python -m unittest discover --start-directory tools/music --pattern 'test_*.py' --verbose

      - name: Validate every track definition without model download
        run: |
          set -euo pipefail
          IDS="$(python -c "import json;print(' '.join(t['id'] for t in json.load(open('music/manifest.json'))['tracks']))")"
          [ -n "$IDS" ] || { echo "::error::Das Manifest enthaelt keinen einzigen Track."; exit 1; }
          for id in $IDS; do
            echo "--- $id"
            python tools/music/generate_music.py --track-id "$id" --dry-run
          done
