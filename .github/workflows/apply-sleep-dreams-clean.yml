name: Apply sleep dream patch clean
on: [push]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/sleep-dreams
          fetch-depth: 0
      - name: Apply patch script
        run: python tools/maintenance/apply_sleep_dreams.py
      - name: Commit patched sources
        run: |
          rm -f .github/workflows/apply-sleep-dreams.yml
          rm -f .github/workflows/apply-sleep-dreams-2.yml
          rm -f .github/workflows/apply-sleep-dreams-clean.yml
          rm -f tools/maintenance/apply_sleep_dreams.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Make sleep exclusive and add dream memories"
          git push origin feature/sleep-dreams
