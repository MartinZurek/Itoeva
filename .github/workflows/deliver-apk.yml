# Auslieferung aufs Telefon.
#
# Nach jedem Merge nach `main` entsteht eine frische Tama-APK, und die eine Datei
# `Tama-debug.apk` im Google-Drive-Ordner wird damit ueberschrieben. Auf dem Telefon aendert
# sich dadurch nichts am Ablauf - Drive-App oeffnen, Datei antippen, "Aktualisieren". Nur das
# lokale Bauen davor entfaellt.
#
# **War zeitweise pausiert, ist es seit 2026-09-02 nicht mehr:** main und ein parallel
# getesteter Feature-Branch teilen sich dieselbe Drive-Datei und dasselbe Telefon. Der
# versionCode kam bis dahin aus `git rev-list --count` - der Commit-Anzahl DES JEWEILS
# GEBAUTEN BRANCHES. Ein kuerzerer Branch (z. B. main direkt nach einem Merge) bekam dadurch
# einen NIEDRIGEREN versionCode als ein laenger laufender Feature-Branch, obwohl main der
# tatsaechlich neuere Bau war - Android verweigerte die Installation als vermeintliches
# Downgrade. Der versionCode kommt jetzt stattdessen aus der Uhrzeit des Laufs (siehe
# "Version bestimmen" unten) und ist dadurch IMMER hoeher als der vorherige, unabhaengig davon,
# welcher Branch zuletzt gebaut hat. Zwei Branches koennen sich damit nicht mehr gegenseitig als
# Downgrade ausschlagen, und die Pause ist ueberfluessig geworden.
#
# Der Drive-Teil laesst sich nachreichen: Solange der Zugang dafuer nicht hinterlegt ist,
# baut und signiert der Lauf trotzdem und legt die fertige APK als Artefakt ab. Damit ist
# der Weg schon nutzbar, bevor das Google-Service-Konto existiert - siehe unten.
#
# Der Grundsatz, an dem alles haengt: **dieselbe Signatur wie die bereits installierte App.**
# Android laesst ein Update nur zu, wenn das Zertifikat uebereinstimmt; sonst bleibt nur
# Deinstallieren - und weil Itoeva ausschliesslich lokal speichert, waeren Pflegebuch,
# Beziehungskapitel und Spielstand damit weg. Deshalb wird hier mit demselben
# Debug-Schluessel signiert, der auch auf dem Entwicklungsrechner benutzt wird (als Secret
# hinterlegt), und deshalb prueft der Schritt "Signatur nachweisen" jedes Mal nach, dass
# wirklich er es war.
#
# Warum nicht der Debug-Schluessel des Runners: Fehlt die Datei, erzeugt AGP sich stillschweigend
# einen NEUEN, zufaelligen Schluessel - bei jedem Lauf einen anderen. Zwei aufeinanderfolgende
# CI-Pakete koennten sich dann nicht einmal gegenseitig updaten. Ein Auslieferungsweg ohne
# hinterlegten Schluessel ist deshalb nicht "unsicherer", sondern schlicht funktionslos.
#
# Warum eine eigene Datei statt eines Jobs in verify.yml: Dieser Lauf sieht Schluesselmaterial
# und einen Drive-Zugang. Beides gehoert in einen Workflow, den weder ein Pull Request noch ein
# Fork ausloesen kann - deshalb unten ausschliesslich `push` auf `main` und `workflow_dispatch`.
#
# Einzurichten unter Settings > Secrets and variables > Actions. Die vier Werte zerfallen in
# zwei Gruppen, und die zweite darf nachgereicht werden:
#
# ZWINGEND - ohne sie bricht der Lauf ab, weil sonst eine APK entstuende, die sich auf dem
# Telefon nicht installieren laesst:
#
#   Secret   DEBUG_KEYSTORE_BASE64   - %USERPROFILE%\.android\debug.keystore, base64-kodiert:
#         [Convert]::ToBase64String([IO.File]::ReadAllBytes("$env:USERPROFILE\.android\debug.keystore"))
#   Variable EXPECTED_SIGNER_SHA256  - Fingerabdruck des Debug-Schluessels, aus:
#         keytool -list -v -keystore "$env:USERPROFILE\.android\debug.keystore" \
#                 -storepass android -alias androiddebugkey
#         Schreibweise egal - Doppelpunkte und Gross-/Kleinschreibung werden unten normalisiert.
#
# NACHREICHBAR - fehlen sie, wird nur die Drive-Ablieferung uebersprungen; die APK liegt dann
# als Artefakt des Laufs bereit, und der Lauf bleibt gruen (Begruendung am Schritt
# "Drive-Zugang pruefen"). Sind sie gesetzt, ist die Ablieferung Pflicht:
#
#   Secret   GDRIVE_SA_JSON          - Schluessel-JSON eines Google-Service-Kontos. Diesem Konto wird
#                               NUR die eine Datei Tama-debug.apk freigegeben (Bearbeiter),
#                               nicht der Ordner darum herum.
#   Variable GDRIVE_APK_FILE_ID      - Datei-Id der bestehenden Tama-debug.apk in Drive. Bewusst die
#                               BESTEHENDE Datei aktualisieren statt eine neue anzulegen: nur so
#                               bleiben Name, Link und Eigentuemer gleich, und das Telefon findet
#                               die Datei am gewohnten Platz.

name: Deliver APK

# -------------------------------------------------------------------------------------------
# War vom 2026-08-30 bis 2026-09-02 pausiert (siehe Kommentar oben am Dateianfang): main und
# ein parallel getesteter Feature-Branch teilten sich dieselbe Drive-Datei/dasselbe Telefon,
# und der damalige versionCode (aus der Commit-Anzahl des jeweiligen Branches) liess main
# regelmaessig als Downgrade erscheinen. Seit der versionCode aus der Laufzeit statt der
# Commit-Anzahl kommt (siehe "Version bestimmen" unten), kann das nicht mehr passieren - der
# `push`-Trigger ist deshalb wieder aktiv.
# -------------------------------------------------------------------------------------------
on:
  push:
    branches: [main]
    # Eine reine Dokumentationsaenderung aendert nichts an der App - dafuer muss kein
    # Paket gebaut und keine Actions-Minute ausgegeben werden.
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

# Standardmaessig gar keine Rechte, wie in claude-primary-run.yml. Dieser Workflow liest nur;
# geschrieben wird ausserhalb von GitHub, naemlich in Drive.
permissions: {}

# Kein cancel-in-progress, aus demselben Grund wie in claude-primary-run.yml: Am Ende dieses
# Laufs steht eine Ablieferung nach aussen. Zwei Laeufe warten lieber aufeinander - sie
# arbeiten die Warteschlange in der Reihenfolge ab, in der die Staende entstanden sind, und
# der neuere schreibt zuletzt.
#
# Die Gruppe ist ABSICHTLICH global (nicht `-${{ github.ref }}` je Branch, Codex-Fund auf
# PR #57): Der versionCode entsteht aus der Uhrzeit BEIM START von "Version bestimmen", nicht
# beim Hochladen. Liefen zwei Laeufe auf verschiedenen Branches parallel (je eigene
# Ref-Gruppe), koennte der frueher gestartete, aber langsamere Lauf NACH einem spaeter
# gestarteten, aber schnelleren Lauf hochladen - und die Drive-Datei bekaeme dann trotz
# steigender Uhrzeit einen NIEDRIGEREN versionCode als vorher, genau das Downgrade-Problem,
# das diese ganze Aenderung beheben soll. Eine einzige Warteschlange ueber alle Branches
# hinweg verhindert das: Lauf N+1 kann erst starten, wenn Lauf N vollstaendig fertig ist
# (Upload eingeschlossen), sein versionCode ist also immer NACH dem vorherigen Hochladen
# entstanden und damit garantiert hoeher.
concurrency:
  group: deliver-apk
  cancel-in-progress: false

env:
  # Dieselbe Untergrenze wie in verify.yml - was ausgeliefert wird, soll unter demselben JDK
  # entstanden sein, unter dem auch geprueft wird.
  JAVA_VERSION: '17'

jobs:

  deliver:
    name: Tama-APK bauen und nach Drive legen
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Referenz: verify schafft Unit-Tests, Lint und zwei minifizierte Probe-Baue in 16,6 min
    # (Lauf #20). Hier laeuft nur ein unminifizierter Debug-Bau eines Moduls, also deutlich
    # weniger. 25 Minuten deckeln trotzdem jeden Haenger.
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      # Nur lesend: Dieser Job traegt Schluesselmaterial und soll den Cache, aus dem sich
      # anschliessend jeder andere Lauf bedient, nicht beschreiben koennen.
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      # -----------------------------------------------------------------------------------
      # Die Version.
      #
      # Minuten seit einem festen Bezugspunkt (2020-01-01 UTC) statt Commit-Anzahl. Der
      # versionCode stieg frueher mit `git rev-list --count HEAD` - der Commit-Anzahl DES
      # JEWEILS GEBAUTEN BRANCHES. Zwei Branches, die sich dasselbe Telefon/dieselbe Drive-Datei
      # teilen (main und ein parallel getesteter Feature-Branch), konnten sich dadurch
      # gegenseitig als Downgrade ausschlagen, sobald der eine (voruebergehend) weniger Commits
      # hatte als der andere zuletzt installierte - unabhaengig davon, welcher Bau tatsaechlich
      # neuer war. Das ist wiederholt passiert und machte eine manuelle Pause noetig (siehe
      # Kommentar am Dateianfang).
      #
      # Minuten seit der festen Bezugszeit haengen dagegen ausschliesslich von der echten
      # Uhrzeit des Laufs ab - nie vom Branch, nie von der Commit-Anzahl. Der naechste Lauf hat
      # IMMER einen hoeheren versionCode als der vorherige, egal auf welchem Branch beide liefen.
      # Sekunden statt Minuten waeren zu fein: Sekunden seit 1970 ueberschreiten schon 2038 den
      # 32-Bit-Bereich, den Android fuer versionCode vorschreibt (das "Jahr-2038-Problem").
      # Minuten seit 2020-01-01 bleiben bis weit nach dem Jahr 4000 innerhalb dieses Bereichs.
      #
      # Ohne jeden gespeicherten Zustand reproduzierbar, wie zuvor - nur die Bezugsgroesse hat
      # sich geaendert. Der Dateiname in Drive bleibt bewusst konstant. Die Eindeutigkeit steckt
      # im Paket: versionName erscheint in den App-Infos des Telefons, dort ist der Stand
      # ablesbar. Bleibt im Schema major.minor.patch (`1.0.<CODE>`), weil `validateRelease` in
      # app-sim/build.gradle.kts genau dieses Schema von JEDEM versionName verlangt, ganz gleich
      # welche Quelle ihn setzt - dieser Lauf ruft `validateRelease` zwar nicht auf, aber ein
      # abweichendes Schema hier waere trotzdem eine unnoetige, leicht vermeidbare Inkonsistenz.
      # -----------------------------------------------------------------------------------
      - name: Version bestimmen
        id: version
        run: |
          set -euo pipefail
          EPOCH_S="$(date -u -d '2020-01-01T00:00:00Z' +%s)"
          NOW_S="$(date -u +%s)"
          CODE=$(( (NOW_S - EPOCH_S) / 60 ))
          # Nicht als Ersatz fuer eine Berechnung gedacht, sondern als letzter Riegel gegen
          # alles, woran hier sonst noch nicht gedacht wurde (z. B. eine falsch gehende Uhr).
          if [ "$CODE" -lt 1 ]; then
            echo "::error::versionCode $CODE ist unbrauchbar."
            exit 1
          fi
          SHA="$(git rev-parse --short=7 HEAD)"
          {
            echo "code=$CODE"
            echo "name=1.0.$CODE"
            echo "sha=$SHA"
            echo "archive=itoeva-dev-$(date -u +%Y%m%d)-$SHA.apk"
          } >> "$GITHUB_OUTPUT"
          echo "versionCode $CODE, versionName 1.0.$CODE, Stand $SHA"

      # -----------------------------------------------------------------------------------
      # Der Schluessel.
      #
      # An genau den Ort, an dem AGP seinen Debug-Schluessel erwartet - damit greift die
      # eingebaute debug-Signaturkonfiguration unveraendert, ohne Passwoerter im Workflow
      # (der Debug-Keystore benutzt die festen Standardwerte android/androiddebugkey).
      # -----------------------------------------------------------------------------------
      - name: Debug-Schluessel einsetzen
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail   # bewusst kein -x: aus diesem Schritt gehoert nichts ins Log
          if [ -z "${DEBUG_KEYSTORE_BASE64}" ]; then
            echo "::error::Secret DEBUG_KEYSTORE_BASE64 fehlt. Ohne den Schluessel des"
            echo "::error::Entwicklungsrechners waere das Paket kein Update der installierten App."
            exit 1
          fi
          mkdir -p "$HOME/.android"
          umask 077
          printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 -d > "$HOME/.android/debug.keystore"
          if [ ! -s "$HOME/.android/debug.keystore" ]; then
            echo "::error::DEBUG_KEYSTORE_BASE64 liess sich nicht dekodieren."
            exit 1
          fi

          # Wo AGP den Debug-Schluessel sucht, haengt an der Version: mal
          # ANDROID_USER_HOME, mal ANDROID_SDK_HOME, sonst user.home + /.android.
          # Ist keine davon gesetzt, greift zwar der Standard - aber "greift der
          # Standard" ist eine Annahme, und faellt sie falsch aus, erzeugt AGP
          # stillschweigend einen NEUEN Schluessel, statt zu klagen. Das faellt dann
          # erst am Signaturnachweis auf, und dort sieht es aus wie ein falsches
          # Secret. Beide Zeiger deshalb ausdruecklich auf dieselbe Datei.
          {
            echo "ANDROID_USER_HOME=$HOME/.android"
            echo "ANDROID_SDK_HOME=$HOME"
          } >> "$GITHUB_ENV"

      # -----------------------------------------------------------------------------------
      # Passen die beiden hinterlegten Werte ueberhaupt zueinander?
      #
      # Der Nachweis nach dem Bau (unten) beantwortet nur, ob die fertige APK den erwarteten
      # Schluessel traegt - nicht, WORAN es lag, wenn nicht. Zwei ganz verschiedene Ursachen
      # sehen dort gleich aus:
      #
      #   1. Secret und Variable gehoeren nicht zusammen - der hinterlegte Schluessel ist ein
      #      anderer als der, auf den EXPECTED_SIGNER_SHA256 zeigt. Dann ist nichts am Bau
      #      falsch, sondern an der Einrichtung.
      #   2. Der Schluessel stimmt, aber AGP hat ihn nicht benutzt und sich einen eigenen
      #      erzeugt. Dann liegt der Fehler in diesem Workflow.
      #
      # Dieser Schritt trennt beides, und zwar in Sekunden statt nach drei Minuten Bauzeit.
      # Der Fingerabdruck eines Zertifikats ist kein Geheimnis - er darf im Log stehen, das
      # Schluesselmaterial selbst nicht.
      # -----------------------------------------------------------------------------------
      - name: Hinterlegten Schluessel gegen die Erwartung pruefen
        env:
          EXPECTED: ${{ vars.EXPECTED_SIGNER_SHA256 }}
        run: |
          set -euo pipefail
          WANT="$(printf '%s' "${EXPECTED:-}" | tr -d ':' | tr 'A-Z' 'a-z')"
          if [ -z "$WANT" ]; then
            echo "::error::Variable EXPECTED_SIGNER_SHA256 ist nicht gesetzt."
            exit 1
          fi
          # Ein von AGP erzeugter Debug-Schluessel hat immer diesen Alias und dieses Passwort.
          if ! LIST="$(keytool -list -v \
                        -keystore "$HOME/.android/debug.keystore" \
                        -storepass android -alias androiddebugkey 2>&1)"; then
            echo "::error::Der hinterlegte Schluesselspeicher liess sich nicht lesen."
            echo "::error::Erwartet wird ein Debug-Keystore mit Alias 'androiddebugkey' und"
            echo "::error::Passwort 'android'. Ist in DEBUG_KEYSTORE_BASE64 wirklich"
            echo "::error::%USERPROFILE%\\.android\\debug.keystore hinterlegt?"
            exit 1
          fi
          HAVE="$(awk 'tolower($0) ~ /^[[:space:]]*sha256:/ {
                         gsub(/:/, "", $2); print tolower($2); exit
                       }' <<< "$LIST")"
          if [ -z "$HAVE" ]; then
            echo "::error::Aus dem Schluesselspeicher liess sich kein SHA-256 lesen."
            exit 1
          fi
          echo "Hinterlegter Schluessel (SHA-256): $HAVE"
          if [ "$HAVE" != "$WANT" ]; then
            echo "::error::Secret und Variable gehoeren nicht zusammen."
            echo "::error::  DEBUG_KEYSTORE_BASE64 enthaelt den Schluessel $HAVE"
            echo "::error::  EXPECTED_SIGNER_SHA256 zeigt dagegen auf $WANT"
            echo "::error::Beide muessen aus DERSELBEN Datei stammen - und zwar aus der, mit der"
            echo "::error::die auf dem Telefon installierte App signiert wurde. Zu pruefen mit:"
            echo "::error::  keytool -list -v -keystore \"\$env:USERPROFILE\\.android\\debug.keystore\" \\"
            echo "::error::          -storepass android -alias androiddebugkey"
            exit 1
          fi
          echo "Schluessel und Erwartung stimmen ueberein - der Bau kann beginnen."

      - name: assembleDebug
        run: >
          ./gradlew :app-sim:assembleDebug
          -PitoevaVersionCode=${{ steps.version.outputs.code }}
          -PitoevaVersionName=${{ steps.version.outputs.name }}
          --stacktrace

      # -----------------------------------------------------------------------------------
      # Der eigentliche Torwaechter dieses Workflows.
      #
      # Dass ueberhaupt signiert wurde, sagt noch nichts - entscheidend ist, mit WELCHEM
      # Zertifikat. Stimmt es nicht mit dem der installierten App ueberein, liesse sich die
      # Datei auf dem Telefon nicht installieren, und das faellt sonst erst dort auf.
      #
      # apksigner statt keytool: bei minSdk 26 signiert AGP ohne v1-/JAR-Signatur, es gibt
      # also kein META-INF/*.RSA, an dem sich das ablesen liesse.
      # -----------------------------------------------------------------------------------
      - name: Signatur nachweisen
        env:
          EXPECTED: ${{ vars.EXPECTED_SIGNER_SHA256 }}
        run: |
          set -euo pipefail
          APK=app-sim/build/outputs/apk/debug/app-sim-debug.apk
          if [ ! -f "$APK" ]; then
            echo "::error::$APK wurde nicht erzeugt."
            exit 1
          fi
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          APKSIGNER="$(ls -1 "$SDK"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1 || true)"
          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner nicht gefunden - Signatur nicht pruefbar, Abbruch."
            exit 1
          fi
          # Erst einsammeln, dann auswerten - und die Auswertung ohne Pipe. `... | head -1`
          # wuerde den Erzeuger per SIGPIPE abwuergen, sobald mehr als eine Zeile passt (v2
          # und v3 liefern je eine), und unter `pipefail` gaelte der Schritt dann als
          # gescheitert, obwohl alles in Ordnung war.
          CERTS="$("$APKSIGNER" verify --print-certs "$APK")"
          FOUND="$(awk 'tolower($0) ~ /certificate sha-256 digest/ {
                          gsub(/:/, "", $NF); print tolower($NF); exit
                        }' <<< "$CERTS")"
          if [ -z "$FOUND" ]; then
            echo "::error::Aus der APK liess sich kein Signaturzertifikat lesen."
            exit 1
          fi
          echo "Signatur der APK (SHA-256): $FOUND"
          # Normalisiert vergleichen: keytool schreibt GROSS mit Doppelpunkten, apksigner
          # klein ohne - beide Schreibweisen sollen als Variable durchgehen.
          WANT="$(printf '%s' "${EXPECTED:-}" | tr -d ':' | tr 'A-Z' 'a-z')"
          if [ -z "$WANT" ]; then
            echo "::error::Variable EXPECTED_SIGNER_SHA256 ist nicht gesetzt."
            echo "::error::Passt der Wert oben zum Schluessel deines Rechners, trage ihn dort ein."
            exit 1
          fi
          if [ "$FOUND" != "$WANT" ]; then
            echo "::error::Fremde Signatur - erwartet war $WANT."
            echo "::error::Diese APK waere kein Update der installierten App, sondern verlangte"
            echo "::error::eine Deinstallation. Nicht ausgeliefert."
            echo "::error::"
            echo "::error::Der hinterlegte Schluessel passte weiter oben noch zur Erwartung - der"
            echo "::error::Fehler liegt also NICHT an den Secrets, sondern daran, dass AGP beim"
            echo "::error::Bauen einen anderen Schluessel benutzt hat als den unter"
            echo "::error::\$HOME/.android/debug.keystore hinterlegten. Dort ansetzen, nicht an"
            echo "::error::der Einrichtung."
            exit 1
          fi
          echo "Signatur stimmt mit der installierten App ueberein."

      - name: Schluesselreste entfernen
        if: always()
        run: rm -f "$HOME/.android/debug.keystore"

      # -----------------------------------------------------------------------------------
      # Erst sichern, dann ausliefern.
      #
      # Bewusst in dieser Reihenfolge: Scheitert der Drive-Teil - abgelaufener Zugang,
      # zurueckgenommene Freigabe, Google-Stoerung -, waere sonst auch das fertig gebaute und
      # gepruefte Paket verloren, und es muesste allein wegen eines Zugangsproblems neu
      # gebaut werden. So liegt es in jedem Fall abholbereit.
      #
      # Der Pfad ist bewusst eng gefasst: nur diese eine Datei, kein `**/build/**`. Dort
      # liegen Zwischenstaende, die in einem Artefakt nichts zu suchen haben.
      #
      # 14 Tage statt der ueblichen 90: Ein privates Repository bezahlt Artefaktspeicher, und
      # jede APK wiegt rund 15 MB. Zweck ist die Rueckfallebene auf den vorherigen Stand -
      # in Drive liegt immer nur der neueste -, nicht ein Archiv.
      # -----------------------------------------------------------------------------------
      - name: Paket als Rueckfallebene sichern
        run: |
          mkdir -p dist
          cp app-sim/build/outputs/apk/debug/app-sim-debug.apk \
             "dist/${{ steps.version.outputs.archive }}"

      - uses: actions/upload-artifact@v4
        with:
          name: itoeva-apk-${{ steps.version.outputs.name }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 14

      # -----------------------------------------------------------------------------------
      # Ist der Drive-Weg ueberhaupt schon eingerichtet?
      #
      # **Nicht eingerichtet ist kein Fehler.** Der Wert dieses Laufs - eine gebaute, gegen
      # den erwarteten Schluessel geprueft signierte APK - steht an dieser Stelle bereits als
      # Artefakt bereit. Wuerde der Lauf mangels Google-Zugang trotzdem rot enden, stuende bei
      # jedem Merge ein roter Haken auf main, der nichts ueber die Software aussagt. Genau
      # diese Falle ist der Grund, warum der release-Job in verify.yml nur von Hand laeuft:
      # ein Pruefzeichen, das dauerhaft rot ist, wird nach kurzer Zeit nicht mehr gelesen.
      #
      # **Uebersprungen wird nur der unkonfigurierte Fall.** Sind beide Werte da, ist die
      # Ablieferung Pflicht: ein abgelaufener Zugang, eine zurueckgenommene Freigabe oder ein
      # Fehler bei Google lassen den Lauf weiterhin scheitern. Sonst wuerde stillschweigend
      # eine veraltete Datei auf dem Telefon liegenbleiben.
      #
      # Warum ueber einen Ausgabewert und nicht direkt in `if:`: Der `secrets`-Kontext steht
      # in Schrittbedingungen nicht zur Verfuegung. Geprueft wird deshalb hier, und nach
      # aussen geht nur "ja" oder "nein" - der Inhalt des Geheimnisses nirgends.
      # -----------------------------------------------------------------------------------
      - name: Drive-Zugang pruefen
        id: drive
        env:
          SA_JSON: ${{ secrets.GDRIVE_SA_JSON }}
          FILE_ID: ${{ vars.GDRIVE_APK_FILE_ID }}
        run: |
          set -euo pipefail
          if [ -n "${SA_JSON}" ] && [ -n "${FILE_ID}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "Drive-Zugang eingerichtet - die APK wird abgeliefert."
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            fehlt=""
            [ -n "${SA_JSON}" ] || fehlt="Secret GDRIVE_SA_JSON"
            [ -n "${FILE_ID}" ] || fehlt="${fehlt:+$fehlt und }Variable GDRIVE_APK_FILE_ID"
            echo "::notice::Drive-Ablieferung uebersprungen - es fehlt: ${fehlt}."
            echo "::notice::Die fertige APK liegt als Artefakt dieses Laufs bereit."
          fi

      # -----------------------------------------------------------------------------------
      # Ablieferung: die BESTEHENDE Drive-Datei ueberschreiben.
      #
      # `files.update` statt `files.create` - dadurch bleiben Datei-Id, Name, Link und
      # Eigentuemer unveraendert. Eine neue Datei haette jedes Mal einen neuen Link, laege
      # dem Service-Konto zur Last statt dem eigenen Drive, und auf dem Telefon staenden mit
      # der Zeit ein Dutzend gleichnamiger Dateien nebeneinander.
      #
      # Der Zugang gilt nur fuer das, was dem Service-Konto ausdruecklich freigegeben wurde -
      # also die eine APK. Der Ordner darum herum enthaelt das ganze Projekt und bleibt fuer
      # den Automaten unsichtbar.
      # -----------------------------------------------------------------------------------
      # Das Zugriffstoken holt sich der Schluessel selbst - siehe runner/gdrive-jwt.sh fuer
      # die Begruendung, warum hier nicht google-github-actions/auth steht.
      - name: Zugriffstoken holen
        id: token
        if: steps.drive.outputs.configured == 'true'
        env:
          SA_JSON: ${{ secrets.GDRIVE_SA_JSON }}
        run: |
          set -euo pipefail
          umask 077
          TMP="$(mktemp -d)"
          # Auch bei einem Fehlschlag: der Schluessel liegt keine Sekunde laenger als noetig
          # im Dateisystem des Runners.
          trap 'rm -rf "$TMP"' EXIT
          printf '%s' "$SA_JSON" > "$TMP/sa.json"

          JWT="$(sh runner/gdrive-jwt.sh "$TMP/sa.json" https://www.googleapis.com/auth/drive)"

          # --fail-with-body, damit bei 4xx Googles Fehlertext im Log steht und nicht nur ein
          # nackter Exitcode - sonst faengt die Fehlersuche wieder bei null an.
          ANTWORT="$(curl --fail-with-body -sS -X POST https://oauth2.googleapis.com/token \
                       --data-urlencode 'grant_type=urn:ietf:params:oauth:grant-type:jwt-bearer' \
                       --data-urlencode "assertion=${JWT}")"

          TOKEN="$(printf '%s' "$ANTWORT" | jq -r '.access_token // empty')"
          [ -n "$TOKEN" ] || { echo "::error::Der OAuth-Endpunkt lieferte kein access_token."; exit 1; }

          # Maskieren, BEVOR der Wert zum Ausgabewert wird: sonst stuende er lesbar in der
          # Fehlermeldung eines nachfolgenden Schritts.
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"
          echo "Token geholt, gueltig eine Stunde."

      - name: APK nach Drive legen
        if: steps.drive.outputs.configured == 'true'
        env:
          TOKEN: ${{ steps.token.outputs.token }}
          FILE_ID: ${{ vars.GDRIVE_APK_FILE_ID }}
          VERSION: ${{ steps.version.outputs.name }}
          SHA: ${{ steps.version.outputs.sha }}
        run: |
          set -euo pipefail
          APK=app-sim/build/outputs/apk/debug/app-sim-debug.apk

          # Inhalt ersetzen.
          curl --fail-with-body -sS -X PATCH \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Content-Type: application/vnd.android.package-archive" \
            --data-binary @"$APK" \
            "https://www.googleapis.com/upload/drive/v3/files/${FILE_ID}?uploadType=media&supportsAllDrives=true" \
            -o /dev/null

          # Beschreibung nachziehen, damit in Drive sichtbar ist, welcher Stand dort liegt.
          curl --fail-with-body -sS -X PATCH \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"description\":\"Itoeva ${VERSION} (${SHA}), gebaut von deliver-apk.yml, Lauf ${GITHUB_RUN_ID}\"}" \
            "https://www.googleapis.com/drive/v3/files/${FILE_ID}?supportsAllDrives=true" \
            -o /dev/null

          echo "Tama-debug.apk in Drive aktualisiert: ${VERSION} (${SHA})"
